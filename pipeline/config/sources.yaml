# Quellen-Metadata (von Hand gepflegt). Speist data/manifest.json + Attribution
# und liefert den Adaptern die Zugangs-Parameter (kind/url/typename/...).
# Basis: SVZ_Quellen_Bundeslaender.md; Endpunkte live verifiziert (Stand Juni 2026).
#
# datasets: das ausgespielte PMTiles-Artefakt (date: auto -> max year über merge).
# sources:  je Land die Zugangs-Metadaten. `status` macht den Reifegrad explizit:
#   live      -> Adapter implementiert + Build läuft gegen diesen Endpunkt
#   ready     -> Endpunkt/typename live verifiziert, Adapter noch zu schreiben
#   research  -> nur Portal-/Landing-Seite bekannt, Endpunkt noch zu finden
#   wms_only  -> Daten existieren nur als WMS-Bild (kein Vektor) -> blockiert

datasets:
  svz_de:
    file: "svz/svz_de.pmtiles"
    label: "Verkehrsmengen (SVZ der Länder)"
    attribution: "Straßenbauverwaltungen der Länder + BASt (dl-de/by-2.0, CC-BY 4.0, dl-de/zero-2.0)"
    date: auto            # max(year) über alle gemergten Länder

sources:
  # =================== live (implementiert) ===================
  be:
    status: live
    kind: wfs
    url: "https://gdi.berlin.de/services/wfs/verkehrsmengen_2023"
    # typename + Felder im Adapter (adapters/be.py): dtvw2023kfz + dtvw2023lkw-Join.
    year: 2023
    license: "dl-de/zero-2.0"
    metric: DTVw          # Berlin: nur Werktage!

  ni:
    status: live
    kind: zip             # INSPIRE-Downloadservice: ZIP mit Shapefile (Sidecars!)
    url: "https://map.strassenbau.niedersachsen.de/zip/DE-NI-SBV_Downloadservice_SVZ_Zaehlstellenbereiche_2021.zip"
    # Felder im Adapter (adapters/ni.py): dtv21/dtvsv21/strkl/strbez/zstnr, EPSG:25832.
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV

  by:
    status: live
    kind: wfs             # ArcGIS-Server-WFS, liefert GEOJSON (output_format im Adapter)
    url: "https://gisportal-stmb.bayern.de/server/services/WFS/BAYSIS_Verkehrsdaten/MapServer/WFSServer"
    # typename + Felder im Adapter (adapters/by.py): svz2021_zaehlstellenbereiche, EPSG:4326.
    year: 2021
    license: "CC-BY-4.0"
    metric: DTV

  # =================== research (Endpunkt noch zu finden) ===================
  hh:
    status: research
    kind: wfs
    url: "https://suche.transparenz.hamburg.de/dataset/verkehrsmengen-auf-hauptverkehrsstrassen-in-hamburg43"
    year: 2019
    license: "dl-de/by-2.0"
    metric: DTV           # tlw. DTVw — beim Implementieren prüfen
  nw:
    status: research
    kind: atom            # Shape via Atom-Feed (Straßen.NRW / Geoportal NRW)
    url: "https://www.wms.nrw.de/rssfeeds/content/geoportal/html/1004.html"
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV
  sl:
    status: research
    kind: wfs
    url: "https://geoportal.saarland.de/"                       # WFS (DTV + DTVSV) suchen
    year: 2021
    license: "dl-de/by-2.0"   # INSPIRE, offen — Wortlaut prüfen
    metric: DTV
  sh:
    status: research
    kind: wfs
    url: "https://geoportal.de/Metadata/4db88cf7-23d6-4207-a3da-8ab1a94508ba"
    year: 2021
    license: "CC-BY-4.0"
    metric: DTV
  th:
    status: research
    kind: wfs
    url: "https://geoportal.thueringen.de/themen/verkehr"      # WFS Zählstellenbereiche
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV
  st:
    status: research
    kind: wfs             # Netz-WFS + Excel-Werte (Join)
    url: "https://www.geodatenportal.sachsen-anhalt.de/"
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV
  mv:
    status: research
    kind: wfs
    url: "https://www.geoportal-mv.de/"                        # WFS (SVZ 2015)
    year: 2015
    license: "dl-de/by-2.0"   # prüfen
    metric: DTV
  bw:
    status: research
    kind: xlsxzip         # Excel (CKAN) + Geometrie-Join auf Zählstellen-Karte
    url: "https://mobidata-bw.de/dataset/endergebnisse_strassenverkehrszaehlung"
    stations_url: "https://mobidata-bw.de/dataset/karte_strassenverkehrszaehlung"
    join: station_id
    year: 2024
    license: "dl-de/by-2.0"
    metric: DTV

  # =================== wms_only / blockiert (kein Vektor) ===================
  rp:
    status: wms_only
    kind: wms
    url: "https://lbm-geo.rlp.de/cgi-bin/mapserv?map=/home/planer/https-wms/bundesverkehrszaehlung_2021.map"
    # Nur WMS-Bild; alter Vektor-WFS spatial-objects/393 liefert serverseitig Fehler.
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV
  sn:
    status: wms_only
    kind: wms             # ttsib-wms; ttsib-wfs existiert nicht (404). GDI-SBV-WFS evtl. separat suchen.
    url: "https://www.list.smwa.sachsen.de/wss/service/ttsib-wms/guest"
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV
  bb:
    status: research
    kind: wfs             # su-vector_zaehlstellen_wfs: echte Zählstellenbereiche-Geometrie (GML)
    url: "https://inspire.brandenburg.de/services/su-vector_zaehlstellen_wfs"
    typename: "su-vector:VectorStatisticalUnit"   # EPSG:25833, MultiLineString
    # ACHTUNG INSPIRE-Statistical-Units-Schema: nur Geometrie + Zählstellennr (thematicId)
    # + Straßenlabel (text, z.B. "K6803"). KEINE DTV-Werte! Werte-Tabelle zum Join über
    # die Zählstellennummer noch finden (LS-Verkehrsstärkenkarte / separater Dienst).
    # (strassennetz_wfs am Geoportal = nur Autobahnkilometrierung, ebenfalls ohne DTV.)
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV

  # HB (Bremen, nur PDF) und HE (Hessen, Viewer/PDF) vorerst weggelassen — A/B via BASt.
