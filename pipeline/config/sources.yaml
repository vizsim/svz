# Quellen-Metadata (von Hand gepflegt) — die EINE Quellenliste des Projekts.
# Speist: die Adapter (kind/url/…), die Registry (status: live -> Adapter-Modul),
# data/manifest.json (-> Quellen-Panel des Viewers: Name/Ebene/Jahr/Lizenz/Zugang).
#
# datasets: die ausgespielten PMTiles, eines je Ebene (date: auto -> max year über merge).
# sources:  je Quelle die Zugangs-Metadaten. Pflichtfelder:
#   status    Reifegrad:
#             live      -> Adapter implementiert, Build läuft (Jahr + Lizenz verifiziert)
#             research  -> Dienst existiert, liefert aber (noch) keine Daten (z.B. Backend defekt)
#             blocked   -> kein maschinenlesbarer Vektor-DTV (nur WMS/PDF/Viewer oder Netz ohne DTV)
#   level     Herausgeber-Ebene: bund | land | kommune  (-> eigenes PMTiles je Ebene)
#   name      Anzeigename (Panel/Popup)
#   state     Bundesland-Kürzel (Kommunen: Land, in dem die Stadt liegt; Bund: DE)
#   kind      zip | geojson | wfs | ogcapi | xlsx | wfs+xlsx | pdf | viewer
#   access    Liste {label,url} für die „Zugang"-Spalte (README/Panel); url/values_url/urls
#             bleiben die technischen Endpunkte der Adapter.
# Adapter-Modul per Konvention: adapters/<code>.py (land/bund) bzw. adapters/kommunal/<code>.py;
# `adapter:` überschreibt. Build-Reihenfolge (`svz build all`) = Reihenfolge hier.
# Sortierung: je Gruppe alphabetisch nach Name.

datasets:
  svz_de:
    file: "svz/svz_de.pmtiles"
    label: "Verkehrsmengen (SVZ der Länder)"
    attribution: "Straßenbauverwaltungen der Länder (dl-de/by-2.0, CC-BY 4.0, dl-de/zero-2.0)"
    date: auto            # max(year) über alle gemergten Länder
  svz_bast:
    file: "svz/svz_bast.pmtiles"
    label: "BASt-Backbone (Bundesfernstraßen A+B)"
    attribution: "© BASt (bundesweite SVZ der Bundesfernstraßen)"
    date: auto
  svz_kommunal:
    file: "svz/svz_kommunal.pmtiles"
    label: "Kommunale Verkehrszählungen"
    attribution: "Städte (dl-de/by-2.0, dl-de/zero-2.0)"
    date: auto

