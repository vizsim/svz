# Quellen-Metadata (von Hand gepflegt). Speist data/manifest.json + Attribution
# und liefert den Adaptern die Zugangs-Parameter (kind/url/...). Inhalte aus
# SVZ_Quellen_Bundeslaender.md (Stand Juni 2026).
#
# datasets: das ausgespielte PMTiles-Artefakt (date: auto -> max year über merge).
# sources:  je Land die Zugangs-Metadaten, die der Adapter nutzt. `url` ist bei
#           manchen Ländern noch die Portal-/Landing-Seite — der konkrete
#           typename/collection/Feldname wird beim Implementieren am Dienst
#           verifiziert (TODO-Markierung pro offenem Land).

datasets:
  svz_de:
    file: "svz/svz_de.pmtiles"
    label: "Verkehrsmengen (SVZ der Länder)"
    attribution: "Straßenbauverwaltungen der Länder + BASt (dl-de/by-2.0, CC-BY 4.0, dl-de/zero-2.0)"
    date: auto            # max(year) über alle gemergten Länder

