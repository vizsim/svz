# Quellen-Metadata (von Hand gepflegt). Speist data/manifest.json + Attribution
# und liefert den Adaptern die Zugangs-Parameter (kind/url/...).
#
# datasets: das ausgespielte PMTiles-Artefakt (date: auto -> max year über merge).
# sources:  je Land die Zugangs-Metadaten. `status` = Reifegrad:
#   live      -> Adapter implementiert, Build läuft (Jahr+Lizenz am Dienst verifiziert)
#   ready     -> Endpunkt/typename live verifiziert, Adapter noch zu schreiben
#   research  -> nur Portal-/Landing-Seite bekannt; Jahr/Lizenz lt. Übersicht (tentativ)
#   wms_only  -> Daten existieren nur als WMS-Bild (kein Vektor) -> blockiert

datasets:
  svz_de:
    file: "svz/svz_de.pmtiles"
    label: "Verkehrsmengen (SVZ der Länder)"
    attribution: "Straßenbauverwaltungen der Länder + BASt (dl-de/by-2.0, CC-BY 4.0, dl-de/zero-2.0)"
    date: auto            # max(year) über alle gemergten Länder

sources:
  # ====================== live (implementiert, verifiziert) ======================
  be:
    status: live
    kind: wfs             # gdi.berlin.de (deegree), application/json
    url: "https://gdi.berlin.de/services/wfs/verkehrsmengen_2023"
    year: 2023            # FeatureType dtvw2023kfz/-lkw (Adapter: be.py)
    license: "dl-de/zero-2.0"
    metric: DTVw          # Berlin: nur Werktage!

  ni:
    status: live
    kind: zip             # INSPIRE-Downloadservice: ZIP mit Shapefile, EPSG:25832
    url: "https://map.strassenbau.niedersachsen.de/zip/DE-NI-SBV_Downloadservice_SVZ_Zaehlstellenbereiche_2021.zip"
    year: 2021            # Adapter: ni.py (dtv21/dtvsv21/strkl/strbez/zstnr)
    license: "dl-de/by-2.0"
    metric: DTV

  by:
    status: live
    kind: wfs             # ArcGIS-Server-WFS, GEOJSON, EPSG:4326
    url: "https://gisportal-stmb.bayern.de/server/services/WFS/BAYSIS_Verkehrsdaten/MapServer/WFSServer"
    year: 2021            # typename svz2021_zaehlstellenbereiche (Adapter: by.py)
    license: "CC-BY-4.0"
    metric: DTV

  bb:
    status: live
    kind: wfs             # nativer deegree-WFS, nur GML -> output_format=None, src_crs=25833
    url: "https://inspire.brandenburg.de/services/zaehlstellen_wfs"
    year: 2021            # typename app:verkehrsstaerke_2021 (Geometrie+Werte; Adapter: bb.py)
    license: "dl-de/by-2.0"
    metric: DTV

  hh:
    status: live
    kind: wfs             # geodienste.hamburg.de, GeoJSON (application/geo+json), EPSG:25832
    url: "https://geodienste.hamburg.de/HH_WFS_Verkehrsmengen"
    year: 2019            # zwei Layer dtv_hvs_2019 + dtv_bab_2019 (Adapter: hh.py)
    license: "dl-de/by-2.0"
    metric: DTV           # nur die sv-Spalte ist ein Anteil (%) -> sv_anteil

  nw:
    status: live
    kind: zip             # Atom-Feed -> direkte Shapefile-ZIP (opengeodata.nrw.de), EPSG:25832
    url: "https://www.opengeodata.nrw.de/produkte/transport_verkehr/strassennetz/Verkehrswerte2019HR_EPSG25832_Shape.zip"
    year: 2019            # DTVKFZA/DTVSVA/STRKL/STRBEZ/ZSTNR (Adapter: nw.py)
    license: "dl-de/by-2.0"   # ATOM <rights>: "Datenlizenz Deutschland Namensnennung 2.0"
    metric: DTV

  # ====================== ready (Endpunkt verifiziert) ======================
  sl:
    status: ready
    kind: wfs             # ArcGIS-Server-WFS (mapbender-Proxy blockt GetFeature -> Backend-URL)
    url: "https://geoportal.saarland.de/arcgis/services/Internet/Verkehr_WFS/MapServer/WFSServer"
    typename: "Verkehr_WFS:SVZ_Zaehlstellen"
    # ACHTUNG: PUNKT-Geometrie (Zählstellen-Standorte), nicht Linien! Felder: DTV/DTVSV/
    # Str ("L 375")/TKZST. Braucht einen Punkt-Zweig in merge/tiles + Punkt-Layer im Frontend.
    year: 2021            # lt. Übersicht; am Datensatz nicht eindeutig datiert
    license: "offen"      # Caps: "keine Zugriffsbeschränkungen / keine Bedingungen"
    metric: DTV

  # ====================== research (Endpunkt noch zu finden) ======================
  th:
    status: research
    kind: wfs
    url: "https://geoportal.thueringen.de/themen/verkehr"      # WFS Zählstellenbereiche
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV
  sh:
    status: research
    kind: wfs
    url: "https://geoportal.de/Metadata/4db88cf7-23d6-4207-a3da-8ab1a94508ba"
    year: 2021
    license: "CC-BY-4.0"
    metric: DTV
  st:
    status: research
    kind: wfs             # Netz-WFS + Excel-Werte (Join)
    url: "https://www.geodatenportal.sachsen-anhalt.de/"
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV
  mv:
    status: research
    kind: wfs
    url: "https://www.geoportal-mv.de/"                        # WFS (SVZ 2015)
    year: 2015
    license: "dl-de/by-2.0"
    metric: DTV
  bw:
    status: research
    kind: xlsxzip         # Excel (CKAN) + Geometrie-Join auf Zählstellen-Karte
    url: "https://mobidata-bw.de/dataset/endergebnisse_strassenverkehrszaehlung"
    stations_url: "https://mobidata-bw.de/dataset/karte_strassenverkehrszaehlung"
    join: station_id
    year: 2024
    license: "dl-de/by-2.0"
    metric: DTV

  # ====================== wms_only / blockiert (kein Vektor) ======================
  sn:
    status: wms_only      # ttsib-wms; ttsib-wfs existiert nicht (404). GDI-SBV-WFS evtl. separat.
    kind: wms
    url: "https://www.list.smwa.sachsen.de/wss/service/ttsib-wms/guest"
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV
  rp:
    status: wms_only      # nur WMS-Bild; alter Vektor-WFS spatial-objects/393 liefert Fehler.
    kind: wms
    url: "https://lbm-geo.rlp.de/cgi-bin/mapserv?map=/home/planer/https-wms/bundesverkehrszaehlung_2021.map"
    year: 2021
    license: "dl-de/by-2.0"
    metric: DTV

  # Weggelassen (nur PDF/Viewer; A/B ohnehin über BASt): HB (Bremen), HE (Hessen).
